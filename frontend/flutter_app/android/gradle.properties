# JVM heap cho Gradle daemon — hợp lý cho mọi máy (4–16 GB RAM)
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Android
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false

# Tắt Kotlin incremental compile — tránh lỗi cross-drive cache trên Windows
# và đảm bảo build sạch trên mọi máy CI/CD
kotlin.incremental=false

# Gradle daemon — bật để build nhanh hơn từ lần 2
org.gradle.daemon=true

# Build parallel — tận dụng đa nhân
org.gradle.parallel=true

# Cấu hình on-demand — chỉ configure project cần thiết
org.gradle.configureondemand=true
