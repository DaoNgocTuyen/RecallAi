# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
  errors:
    # Flutter 3.47+ emits a false-positive "package:flutter/material.dart is
    # deprecated" info on every file. The suggested replacement
    # (package:material_ui/material_ui.dart) does not exist on pub.dev and the
    # migration is not applicable to production apps. Suppress until resolved
    # upstream: https://github.com/flutter/flutter/issues/XXXXX
    deprecated_member_use: ignore
    # library names are optional in Dart 3; suppress stub-package noise
    unnecessary_library_name: ignore

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # avoid_print: false
    # prefer_single_quotes: true
